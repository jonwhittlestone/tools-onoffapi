name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true           # caches the Go module cache between runs

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Run tests
        # Scoped to packages that actually have tests. Including the no-test-file
        # root package (main.go) under -cover trips "go: no such tool covdata" on
        # this runner's Go toolchain — a coverage-tooling quirk, not a real failure
        # (both handlers and models passed every test while this was failing).
        run: go test ./handlers/... ./models/... -v -cover
        env:
          # Tests don't start the real server so API_KEY is not needed,
          # but set a dummy value so any env reads don't panic
          API_KEY: ci-test-key
