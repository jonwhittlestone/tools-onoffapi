<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>onoffapi</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="login">
        <h1>onoffapi</h1>
        <form id="login-form">
            <label for="password">API key</label>
            <input type="password" id="password" placeholder="Enter API key" autofocus>
            <button type="submit">Login</button>
        </form>
        <p id="login-error" class="error"></p>
    </div>

    <div id="app" style="display:none">
        <h1>Machines <button id="theme-toggle">🌓</button> <button id="logout">Logout</button></h1>
        <div id="machines"></div>
    </div>

    <script>
        let apiKey = localStorage.getItem('apiKey');

        // Theme
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) root.setAttribute('data-theme', savedTheme);

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('theme-toggle').addEventListener('click', () => {
                const current = root.getAttribute('data-theme');
                const isDark = current === 'dark' || (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
                const next = isDark ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });
        });

        function applyState(machineId, reachable, suspended) {
            const card = document.getElementById('status-' + machineId).closest('.machine');
            const wakeBtn = card.querySelector('[data-cmd="wake"]');
            const suspendBtn = card.querySelector('[data-cmd="suspend"]');
            const shutdownBtn = card.querySelector('[data-cmd="shutdown"]');
            if (wakeBtn) wakeBtn.disabled = reachable;
            if (suspendBtn) suspendBtn.disabled = !reachable;
            if (shutdownBtn) shutdownBtn.disabled = !reachable;
            // Every screentime action (including UNLOCK SCREEN) needs SSH to a
            // running desktop session, so the whole panel is pointless — and
            // its buttons would just fail — while the machine is offline.
            const screentimePanel = card.querySelector('.screentime-panel');
            if (screentimePanel) screentimePanel.style.display = reachable ? '' : 'none';
            const indicator = card.querySelector('.state-indicator');
            if (reachable) {
                indicator.textContent = '🟢 online';
                indicator.className = 'state-indicator';
            } else if (suspended) {
                indicator.textContent = '💤 suspended';
                indicator.className = 'state-indicator suspended';
            } else {
                indicator.textContent = '🔴 offline';
                indicator.className = 'state-indicator';
            }
        }

        function pollState(machineId) {
            async function check() {
                try {
                    const res = await fetch('./machines/' + machineId + '/ping', {
                        headers: { 'X-API-Key': apiKey },
                        signal: AbortSignal.timeout(3000)
                    });
                    if (!res.ok) return;
                    const { reachable } = await res.json();
                    applyState(machineId, reachable, false);
                } catch (_) {}
            }
            check();
            return setInterval(check, 10000);
        }

        // --- Screentime timer display ---
        // Server is source of truth. Clients poll every 10s and tick locally between syncs.
        // Any browser on any device sees the same countdown within 10s of loading.

        const screentimePolls = {};
        const screentimeUsersByMachine = {};
        const screentimeIsAdminByMachine = {};
        const selectedScreentimeUser = {};

        function getSelectedScreentimeUser(machineId) {
            if (selectedScreentimeUser[machineId]) return selectedScreentimeUser[machineId];
            const users = screentimeUsersByMachine[machineId] || [];
            return users.length ? users[0].id : '';
        }

        function isAdminScreentimeUser(machineId) {
            const users = screentimeUsersByMachine[machineId] || [];
            // Single-user machine — admin status comes from the machine's own
            // is_admin flag (e.g. doylestone440's maker has no sudo there,
            // unlike joseph-laptop's joseph), not assumed true.
            if (!users.length) return !!screentimeIsAdminByMachine[machineId];
            const u = users.find(x => x.id === getSelectedScreentimeUser(machineId));
            return u ? !!u.is_admin : true;
        }

        function screentimeQS(machineId) {
            const uid = getSelectedScreentimeUser(machineId);
            return uid ? ('?user=' + encodeURIComponent(uid)) : '';
        }

        // Enables/disables the lock-account checkbox and UNLOCK ACCOUNT button
        // based on whether the selected screentime user has sudo — non-admin
        // accounts (e.g. maker) can't have their password swapped to lock
        // them out, since chpasswd requires sudo they don't have.
        function updateScreentimeUserUI(machineId) {
            const admin = isAdminScreentimeUser(machineId);
            const lockCb = document.getElementById('st-lock-' + machineId);
            const unlockBtn = document.getElementById('st-unlock-' + machineId);
            if (lockCb) {
                lockCb.disabled = !admin;
                if (!admin) lockCb.checked = false;
            }
            toggleRestore(machineId);
            if (unlockBtn) {
                unlockBtn.disabled = !admin;
                unlockBtn.title = admin ? '' : 'Not available — this account has no sudo access';
            }
        }

        function switchScreentimeUser(machineId, userId) {
            selectedScreentimeUser[machineId] = userId;
            const panel = document.getElementById('st-display-' + machineId)?.closest('.screentime-panel');
            if (panel) {
                panel.querySelectorAll('.screentime-tab').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.user === userId);
                });
            }
            updateScreentimeUserUI(machineId);
            startScreentimePoll(machineId);
        }

        function setScreentimeActive(machineId, active, lockAccount = false) {
            const display   = document.getElementById('st-display-'  + machineId);
            const startBtn  = document.getElementById('st-start-'    + machineId);
            const stopBtn   = document.getElementById('st-stop-'     + machineId);
            const unlockBtn = document.getElementById('st-unlock-'   + machineId);
            const durInput  = document.getElementById('st-duration-' + machineId);
            const lockCb    = document.getElementById('st-lock-'     + machineId);
            const restInput = document.getElementById('st-restore-'  + machineId);

            if (display)   display.style.display = active ? 'flex' : 'none';
            if (startBtn)  startBtn.disabled  = active;
            if (stopBtn)   stopBtn.disabled   = !active;
            if (durInput)  durInput.disabled  = active;
            if (lockCb)    lockCb.disabled    = active;
            if (restInput) restInput.disabled = active;

            const panel = display && display.closest('.screentime-panel');
            if (panel) panel.querySelectorAll('.preset-btn').forEach(b => b.disabled = active);
            const card = display && display.closest('.machine');
            const shutdownBtn = card && card.querySelector('[data-cmd="shutdown"]');
            if (shutdownBtn) shutdownBtn.disabled = active && lockAccount;
        }

        function startScreentimePoll(machineId) {
            if (screentimePolls[machineId]) {
                clearInterval(screentimePolls[machineId].tickId);
                clearInterval(screentimePolls[machineId].syncId);
            }

            let remainingSecs = 0;

            async function sync() {
                try {
                    const res = await fetch('./machines/' + machineId + '/screentime' + screentimeQS(machineId), {
                        headers: { 'X-API-Key': apiKey }
                    });
                    if (!res.ok) return;
                    const data = await res.json();
                    if (data.active) {
                        remainingSecs = data.remaining_secs;
                        const lockEl = document.getElementById('st-lock-indicator-' + machineId);
                        const countEl = document.getElementById('st-countdown-' + machineId);
                        if (countEl) countEl.textContent = fmtSecs(remainingSecs);
                        if (lockEl) lockEl.style.display = data.lock_account ? 'inline' : 'none';
                        setScreentimeActive(machineId, true, data.lock_account);
                    } else {
                        remainingSecs = 0;
                        setScreentimeActive(machineId, false);
                    }
                } catch (_) {}
            }

            function tick() {
                if (remainingSecs > 0) {
                    remainingSecs = Math.max(0, remainingSecs - 1);
                    const el = document.getElementById('st-countdown-' + machineId);
                    if (el) el.textContent = fmtSecs(remainingSecs);
                    if (remainingSecs === 0) setScreentimeActive(machineId, false);
                }
            }

            sync();
            const syncId = setInterval(sync, 10000);
            const tickId = setInterval(tick, 1000);
            screentimePolls[machineId] = { tickId, syncId };
        }

        function fmtSecs(s) {
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
        }

        async function loadMachines() {
            const res = await fetch('./machines', { headers: { 'X-API-Key': apiKey } });
            if (!res.ok) {
                if (res.status === 401) { logout(); return; }
                document.getElementById('machines').textContent = 'Error: ' + res.status;
                return;
            }
            const machines = await res.json();
            document.getElementById('machines').innerHTML = machines.map(m => `
                <div class="machine">
                    <h2>${m.name}</h2>
                    <p><strong>IP:</strong> ${m.ip}</p>
                    ${m.mac ? `<p><strong>MAC:</strong> ${m.mac}</p>` : ''}
                    ${m.notes ? `<p>${m.notes}</p>` : ''}
                    <div class="machine-actions">
                        ${m.hide_wake ? '' : `<button data-cmd="wake" onclick="action('${m.id}','wake',this)">☀️ WAKE</button>`}
                        ${m.hide_suspend ? '' : `<button data-cmd="suspend" onclick="action('${m.id}','suspend',this)">💤 SUSPEND</button>`}
                        <button data-cmd="shutdown" onclick="action('${m.id}','shutdown',this)">🌙 SHUTDOWN</button>
                        <span class="state-indicator"></span>
                        <span class="status" id="status-${m.id}"></span>
                    </div>
                    ${m.has_screentime ? screentimePanel(m.id, m.screentime_users) : ''}
                </div>
            `).join('');
            machines.forEach(m => {
                pollState(m.id);
                screentimeUsersByMachine[m.id] = m.screentime_users || [];
                screentimeIsAdminByMachine[m.id] = !!m.is_admin;
                if (m.has_screentime) {
                    if (!selectedScreentimeUser[m.id] && screentimeUsersByMachine[m.id].length) {
                        selectedScreentimeUser[m.id] = screentimeUsersByMachine[m.id][0].id;
                    }
                    updateScreentimeUserUI(m.id);
                    startScreentimePoll(m.id);
                }
            });
        }

        function screentimePanel(id, users) {
            const userTabs = (users && users.length > 1) ? `
                <div class="screentime-tabs" role="tablist">
                    ${users.map((u, i) => `<button type="button" class="screentime-tab${i === 0 ? ' active' : ''}" data-user="${u.id}" onclick="switchScreentimeUser('${id}','${u.id}')">${u.id}</button>`).join('')}
                </div>` : '';
            return `
            <div class="screentime-panel">
                <h3>Screen Time</h3>
                ${userTabs}

                <div id="st-display-${id}" class="st-timer-display" style="display:none">
                    <span class="st-countdown" id="st-countdown-${id}">00:00:00</span>
                    <span class="st-lock-badge" id="st-lock-indicator-${id}" style="display:none">🔒 locked</span>
                    <span class="st-label">remaining</span>
                </div>

                <div class="screentime-presets">
                    <span>Quick:</span>
                    <button class="preset-btn" onclick="setDuration('${id}','30m')">30m</button>
                    <button class="preset-btn" onclick="setDuration('${id}','1h')">1h</button>
                    <button class="preset-btn" onclick="setDuration('${id}','2h')">2h</button>
                    <button class="preset-btn" onclick="setDuration('${id}','3h')">3h</button>
                </div>
                <div class="screentime-inputs">
                    <input type="text" id="st-duration-${id}" placeholder="e.g. 1h30m" value="1h">
                    <label class="checkbox-label">
                        <input type="checkbox" id="st-lock-${id}" onchange="toggleRestore('${id}')" checked>
                        Lock account
                    </label>
                    <span id="st-restore-wrap-${id}">
                        Restore after:
                        <input type="text" id="st-restore-${id}" value="10m" class="restore-input">
                    </span>
                </div>
                <div class="screentime-actions">
                    <button id="st-start-${id}" onclick="startScreentime('${id}')">▶ START TIMER</button>
                    <button id="st-stop-${id}" onclick="stopScreentime('${id}')" disabled>■ STOP TIMER</button>
                </div>
                <div class="screentime-actions">
                    <button id="st-unlockscreen-${id}" class="unlock-btn" onclick="unlockScreen('${id}')">🔓 UNLOCK SCREEN</button>
                    <button id="st-unlock-${id}" class="unlock-btn" onclick="unlockScreentime('${id}')">🔓 UNLOCK ACCOUNT</button>
                </div>
                <div class="password-inputs">
                    <input type="password" id="st-newpw-${id}" placeholder="New password">
                    <button onclick="setPassword('${id}')">🔑 SET PASSWORD</button>
                </div>
                <span class="status" id="st-status-${id}"></span>
            </div>`;
        }

        function setDuration(machineId, duration) {
            document.getElementById('st-duration-' + machineId).value = duration;
        }

        function toggleRestore(machineId) {
            const checked = document.getElementById('st-lock-' + machineId).checked;
            document.getElementById('st-restore-wrap-' + machineId).style.display = checked ? '' : 'none';
        }

        async function startScreentime(machineId) {
            const duration = document.getElementById('st-duration-' + machineId).value.trim();
            const lockAccount = document.getElementById('st-lock-' + machineId).checked;
            const restoreAfter = document.getElementById('st-restore-' + machineId).value.trim();
            const statusEl = document.getElementById('st-status-' + machineId);

            if (!duration) { statusEl.textContent = 'Enter a duration first'; return; }
            statusEl.textContent = 'Starting…';

            const body = { duration, action: 'lock', lock_account: lockAccount };
            if (lockAccount && restoreAfter) body.restore_after = restoreAfter;

            try {
                const res = await fetch('./machines/' + machineId + '/screentime' + screentimeQS(machineId), {
                    method: 'POST',
                    headers: { 'X-API-Key': apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    const data = await res.json().catch(() => ({}));
                    const lockMsg = lockAccount ? ` · locks for ${restoreAfter || '10m'}` : '';
                    statusEl.textContent = `Started: ${duration}${lockMsg}`;
                    // Show countdown immediately using total_secs from response.
                    // The sync() inside startScreentimePoll will confirm and correct.
                    if (data.total_secs) {
                        const countEl = document.getElementById('st-countdown-' + machineId);
                        if (countEl) countEl.textContent = fmtSecs(data.total_secs);
                    }
                    setScreentimeActive(machineId, true, lockAccount);
                    startScreentimePoll(machineId);
                } else {
                    const data = await res.json().catch(() => ({}));
                    statusEl.textContent = 'Error: ' + (data.error || res.status);
                }
            } catch (e) {
                statusEl.textContent = 'Network error';
            }
        }

        async function stopScreentime(machineId) {
            const statusEl = document.getElementById('st-status-' + machineId);
            statusEl.textContent = 'Stopping…';
            try {
                const res = await fetch('./machines/' + machineId + '/screentime' + screentimeQS(machineId), {
                    method: 'DELETE',
                    headers: { 'X-API-Key': apiKey }
                });
                if (res.ok) {
                    statusEl.textContent = 'Timer stopped';
                    setScreentimeActive(machineId, false);
                } else {
                    statusEl.textContent = 'Error ' + res.status;
                }
            } catch (e) {
                statusEl.textContent = 'Network error';
            }
        }

        async function unlockScreentime(machineId) {
            const statusEl = document.getElementById('st-status-' + machineId);
            statusEl.textContent = 'Unlocking…';
            try {
                const res = await fetch('./machines/' + machineId + '/screentime/unlock' + screentimeQS(machineId), {
                    method: 'POST',
                    headers: { 'X-API-Key': apiKey }
                });
                statusEl.textContent = res.ok ? 'Account unlocked' : 'Error ' + res.status;
            } catch (e) {
                statusEl.textContent = 'Network error';
            }
        }

        // Dismisses the GNOME lock screen remotely without ever typing the
        // password — so you don't have to reveal it to whoever's asking.
        async function unlockScreen(machineId) {
            const statusEl = document.getElementById('st-status-' + machineId);
            statusEl.textContent = 'Unlocking screen…';
            try {
                const res = await fetch('./machines/' + machineId + '/unlock-screen', {
                    method: 'POST',
                    headers: { 'X-API-Key': apiKey }
                });
                statusEl.textContent = res.ok ? '🔓 Screen unlocked' : 'Error ' + res.status;
            } catch (e) {
                statusEl.textContent = 'Network error';
            }
        }

        async function setPassword(machineId) {
            const pwInput = document.getElementById('st-newpw-' + machineId);
            const password = pwInput.value;
            const statusEl = document.getElementById('st-status-' + machineId);

            if (!password) { statusEl.textContent = 'Enter a new password first'; return; }
            statusEl.textContent = 'Setting password…';

            try {
                const res = await fetch('./machines/' + machineId + '/password', {
                    method: 'POST',
                    headers: { 'X-API-Key': apiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                if (res.ok) {
                    statusEl.textContent = 'Password updated';
                    pwInput.value = '';
                } else {
                    const data = await res.json().catch(() => ({}));
                    statusEl.textContent = 'Error: ' + (data.error || res.status);
                }
            } catch (e) {
                statusEl.textContent = 'Network error';
            }
        }

        function showApp() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = '';
            loadMachines();
        }

        function logout() {
            localStorage.removeItem('apiKey');
            apiKey = null;
            document.getElementById('app').style.display = 'none';
            document.getElementById('login').style.display = '';
            document.getElementById('password').value = '';
        }

        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            apiKey = document.getElementById('password').value.trim();
            const res = await fetch('./machines', { headers: { 'X-API-Key': apiKey } });
            if (!res.ok) {
                document.getElementById('login-error').textContent = 'Invalid API key';
                return;
            }
            localStorage.setItem('apiKey', apiKey);
            showApp();
        });

        async function action(id, cmd, btn) {
            btn.disabled = true;
            const statusEl = document.getElementById('status-' + id);
            statusEl.textContent = cmd + '…';
            try {
                const res = await fetch('./machines/' + id + '/' + cmd, {
                    method: 'POST',
                    headers: { 'X-API-Key': apiKey }
                });
                if (res.ok) {
                    statusEl.textContent = 'OK';
                    if (cmd === 'wake') applyState(id, true, false);
                    else if (cmd === 'suspend') applyState(id, false, true);
                    else applyState(id, false, false);
                } else {
                    statusEl.textContent = 'Error ' + res.status;
                    btn.disabled = false;
                }
            } catch (e) {
                statusEl.textContent = 'Network error';
                btn.disabled = false;
            }
        }

        document.getElementById('logout').addEventListener('click', logout);

        async function init() {
            const urlKey = new URLSearchParams(window.location.search).get('key');
            if (urlKey) {
                const res = await fetch('./auth?key=' + encodeURIComponent(urlKey));
                if (res.ok) {
                    apiKey = urlKey;
                    localStorage.setItem('apiKey', apiKey);
                    history.replaceState(null, '', window.location.pathname);
                    showApp();
                } else {
                    document.getElementById('login-error').textContent = 'Invalid key in link';
                }
            } else if (apiKey) {
                showApp();
            }
        }

        init();
    </script>
</body>
</html>
